# Managed by Worklone — toggling "PR Review" off in Automations removes this file.
# Based on PR-Agent's published GitHub Action workflow, unchanged except for the
# two blocks marked "Worklone" below.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Worklone: the credential. PR-Agent's own OPENROUTER settings, so
          # nothing here is a patch — only the endpoint is ours, which makes the
          # secret a scoped Worklone token instead of a provider key.
          OPENROUTER__KEY: ${{ secrets.WORKLONE_TOKEN }}
          OPENROUTER__API_BASE: ${{ secrets.WORKLONE_API_BASE }}/api/llm/v1
          CONFIG__MODEL: "openrouter/deepseek/deepseek-v4-flash"
          CONFIG__FALLBACK_MODELS: "[]"
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
          # --- Worklone: act on pushes to an open PR, not just on its events.
          # Their `on:` block already listens for `synchronize`, but PR-Agent
          # leaves handle_push_trigger false, so that job would start and exit
          # having done nothing. Turning it on is what makes the review follow
          # the branch as it changes; push_commands stays at their default of
          # ['/describe', '/review'].
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "true"

      # --- Worklone: report what PR-Agent produced back to Worklone, so the
      # Automations page shows it without anyone opening GitHub.
      - name: Report to Worklone
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKLONE_TOKEN: ${{ secrets.WORKLONE_TOKEN }}
          WORKLONE_BASE: ${{ secrets.WORKLONE_API_BASE }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          comments=$(gh api "repos/$PR_REPO/issues/$PR_NUMBER/comments?per_page=100" || echo '[]')
          reviews=$(gh api "repos/$PR_REPO/pulls/$PR_NUMBER/reviews?per_page=100" || echo '[]')
          jq -n \
            --arg repo "$PR_REPO" --arg sha "$PR_SHA" --arg title "$PR_TITLE" \
            --arg url "$PR_URL" --arg runUrl "$RUN_URL" \
            --argjson number "$PR_NUMBER" \
            --argjson comments "$comments" --argjson reviews "$reviews" \
            '{repo:$repo, number:$number, sha:$sha, title:$title, url:$url, runUrl:$runUrl, comments:$comments, reviews:$reviews}' \
          | curl -sS --max-time 30 -X POST "$WORKLONE_BASE/api/cloud-agent/pr/report" \
              -H "authorization: Bearer $WORKLONE_TOKEN" \
              -H "content-type: application/json" \
              --data-binary @- || echo "worklone: report callback failed (the review itself is unaffected)"
